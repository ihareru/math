{% extends "base.html" %}

{% block title %}
Проверка кода — Math Game
{% endblock %}

{% block content %}
<section class="page-card">
    <h1>Введите код</h1>

    <p>
        Код отправлен на:
        <strong>{{ reset_user.email }}</strong>
    </p>

    <form method="post" novalidate>
        {% csrf_token %}

        <div class="form-group">
            <label for="{{ form.code.id_for_label }}">
                {{ form.code.label }}
            </label>

            {{ form.code }}

            {% for error in form.code.errors %}
                <div class="form-errors">
                    {{ error }}
                </div>
            {% endfor %}
        </div>

        <div class="form-actions">
            <button class="button" type="submit">
                Проверить код
            </button>
        </div>
    </form>

    <form
        action="{% url 'accounts:password_reset_resend' %}"
        method="post"
    >
        {% csrf_token %}

        <button class="link-button" type="submit">
            Отправить код повторно
        </button>
    </form>
</section>
{% endblock %}
